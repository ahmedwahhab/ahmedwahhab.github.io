name: sync up to codecommit

on:
  push:
    branches:
      - main
      - staging

env:
  AWS_REGION: "ca-central-1"

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: arn:aws:iam::772335252546:role/GitHubAction-AssumeRoleWithAction
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Get git-remote-codecommit
        run: |
          pip install git-remote-codecommit
          - name: Push to CodeCommit
            run: |
              git config --global credential.helper '!aws codecommit credential-helper $@'
              git config --global credential.UseHttpPath true
              
              # Add CodeCommit as a remote
              git remote add codecommit codecommit::${{ env.AWS_REGION }}://personal-s3-webpage
              
              # Only push the current branch that triggered the workflow
              if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                git push codecommit main
              elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
                git push codecommit staging
              fi

